<!DOCTYPE html>
<!-- 姓名：庞智元，日期：功能名称。 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css3</title>
<style>
    .main{
        display: flex;
        flex-wrap:wrap;
        margin:10px;       
    }
    .box{
        width:150px;
        height:150px;
        border:1px solid #ccc;
        display:flex;
        /*水平垂直居中*/
        justify-content: center;
        align-items: center;
        font-size:40px;
        transition:all 0.6s;
        box-sizing:border-box;/*width:包含paddinghe border*/
    }
        .box:first-child:hover{
            background-color: red;
            color:white;
            font-size:140px;
        }
        .box:nth-child(2):hover{
            border-radius:50%;
            border-width:10px;
        }
        .box:nth-child(3):hover{
            box-shadow: 10px 10px 10px red;
        }
        .box:nth-of-type(4):hover{
            text-shadow: 100px 10px 10px #ccc;
        }
    .box:nth-of-type(5):hover{
        /*线性渐变*/
        background: linear-gradient(to right,red,blue);
    }
    .box:nth-of-type(5)+.box{
       /*径向渐变*/
        background: radial-gradient(to right,red,blue);
    }
    /*相邻兄弟选择器
    +后面的一个兄弟
    ~后面的所有兄弟*/
    .box:nth-of-type(7).box:hover{
        transform: scale(1.5);/*缩放*/
    }
    .box:nth-child(8):hover{
        transform: translate(-150px);/*平移*/
    }
    .box:nth-child(9):hover{
        transform: rotateX(-180deg);/*旋转*/
    }
    .box:nth-child(10):hover{
        transform: skewX(20deg) translateY(50px);/*倾斜*/
    }
    .box:nth-last-child(2):hover:before{
        /*内部的最前面的元素*/
        content:"*";
        color:red;
    }
    /*扩展，第12个盒子，鼠标在上面时显示自己的名字，要求名字深色背景白色文字，水平垂直居中*/
    .box:nth-child(12):hover::after{
    content:"庞智元";
    display: flex;
    justify-content: center;  /*水平居中*/
    align-items: center;     /*垂直居中*/
    background: #222;        /*深色背景*/
    color: white;            /*白色文字*/
    padding:5px 10px;
    font-size:16px;
    /* 加上定位，让文字叠加在盒子上面，不然会挤开原有布局 */
    position:absolute;
    inset:0;
}
.box:nth-child(3n):hover{
    border:3px solid red;
}
/*偶数：even，奇数：odd*/
/*扩展2：鼠标在偶数个盒子上时，边框变为蓝色*/
.box:nth-child(even):hover{
    border:3px solid blue;
}
</style>
</style>
</head>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>
</body>
</html>
