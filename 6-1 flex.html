<!DOCTYPE html>
<!-- 姓名：庞智元，日期：功能名称。 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex 布局演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        h2{
            text-align: center;
            margin:20px 0;
            font-size:32px;
        }
        .flex {
            display: flex;
            flex-wrap: nowrap;
            justify-content: space-evenly;
            padding:0 30px;
        }
        .flex li {
            width: 22%;
            height: 320px;
            border: 1px solid #333;
            list-style: none;
            display: flex;
            padding:15px;
        }
        .box {
            border: 1px solid #666;
            background: #eee;
        }

        /* 1.第一个：单个方块居中 */
        .flex li:nth-child(1) {
            justify-content: center;
            align-items: center;
        }
        .flex li:nth-child(1) .box{
            width:70px;
            height:70px;
        }

        /* 2.第二个：上下两个方块，垂直居中排列 */
        .flex li:nth-child(2) {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap:20px;
        }
        .flex li:nth-child(2) .box{
            width:90px;
            height:70px;
        }

        /*3.第三个：2行2列 四个方块网格*/
        .flex li:nth-child(3) {
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap:12px;
        }
        .flex li:nth-child(3) .box{
            width: calc(50% - 6px);
            height:70px;
        }

        /*4.第四个：上面1个通栏，下面并排2个*/
        .flex li:nth-child(4) {
    flex-wrap: wrap;
    justify-content: center;
    align-content: flex-start;  /* 多行整体靠上 */
    align-items: flex-start;     /* 子项不被拉高 */
    gap: 12px;
}
        .flex li:nth-child(4) .box:nth-child(1){
            width:100%;
            height:70px;
        }
        .flex li:nth-child(4) .box:nth-child(2),
        .flex li:nth-child(4) .box:nth-child(3){
            width: calc(50% - 6px);
            height:70px;
        }
    </style>
</head>
<body>
    <h2>Flex 布局演示</h2>
    <ul class="flex">
        <!-- 1.单方块居中 -->
        <li>
            <div class="box"></div>
        </li>
        <!-- 2.垂直两个方块 -->
        <li>
            <div class="box"></div>
            <div class="box"></div>
        </li>
        <!--3. 2×2网格4个方块 -->
        <li>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </li>
        <!--4.上1下2布局 -->
        <li>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </li>
    </ul>
</body>
</html>
